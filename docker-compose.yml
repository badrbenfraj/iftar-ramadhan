# Production stack, deployed to /opt/iftar on the server by
# deploy/deploy-backend.sh (see docs/DEPLOYMENT.md).
name: iftar

services:
  caddy:
    image: caddy:2
    container_name: iftar-proxy
    depends_on:
      - app
    environment:
      # The server's hostname (SERVER_HOST), e.g. vps-xxxx.vps.ovh.net.
      DOMAIN: ${DOMAIN:?set DOMAIN to the server hostname}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./releases:/srv/releases:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - iftar-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: iftar-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iftar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    container_name: iftar-adminer
    environment:
      ADMINER_DEFAULT_DRIVER: pgsql
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USER: ${DB_USER:-postgres}
      ADMINER_DEFAULT_PASSWORD: ${DB_PASS:-postgres}
      ADMINER_DEFAULT_DB: ${DB_NAME:-postgres}
      ADMINER_DESIGN: nette
      ADMINER_PLUGINS: "tables-filter tinymce"
    depends_on:
      - postgres
    networks:
      - iftar-network

  app:
    # Built on the server from apps/backend (no image registry to manage).
    build:
      context: ./apps/backend
      args:
        APP_ENV: ${APP_ENV:-production}
    image: iftar-backend:local
    container_name: iftar-app
    volumes:
      # Read-only: the API reads latest.json / minimum-version from here.
      - ./releases:/srv/releases:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Tunis}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_ACCESS_TOKEN_EXP_IN_SEC: ${JWT_ACCESS_TOKEN_EXP_IN_SEC}
      JWT_REFRESH_TOKEN_EXP_IN_SEC: ${JWT_REFRESH_TOKEN_EXP_IN_SEC}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      DEFAULT_ADMIN_USER_PASSWORD: ${DEFAULT_ADMIN_USER_PASSWORD}
      APP_PORT: 3000
      RELEASES_DIR: /srv/releases
      WAIT_HOSTS: postgres:5432
    networks:
      - iftar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  iftar-network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config: